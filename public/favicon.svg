<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background -->
  <rect width="100" height="100" fill="#050505" rx="22" />
  
  <!-- Subtle tech crosshairs -->
  <path d="M 10 10 L 90 90 M 90 10 L 10 90" stroke="#FF006E" stroke-width="2" opacity="0.15" />
  
  <!-- Tech border -->
  <rect x="12" y="12" width="76" height="76" fill="none" stroke="#00F5D4" stroke-width="3" stroke-dasharray="12 6" rx="12"/>
  
  <!-- The Letter 'G' in neon pink -->
  <text x="50" y="74" font-family="'Courier New', Courier, monospace" font-size="70" font-weight="bold" fill="#FF006E" text-anchor="middle">G</text>
  
  <!-- Glowing status dot -->
  <circle cx="82" cy="18" r="5" fill="#00F5D4" />
</svg>
